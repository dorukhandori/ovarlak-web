<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ovarlak Games</title>
    <meta
      name="description"
      content="Ovarlak Games — tarayıcıda oynanan kısa Odysseia durakları. İlk durak: Lotophagoi."
    />
    <link rel="canonical" href="https://ovarlak.games/" />
    <meta property="og:title" content="Ovarlak Games" />
    <meta
      property="og:description"
      content="Tarayıcıda oynanan kısa Odysseia durakları. İndirme yok."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ovarlak.games/" />
    <meta property="og:image" content="https://ovarlak.games/media/shore.webp" />
    <style>
      :root {
        --ink: #3a2a17;
        --milk: #fbf6ec;
        --gold: #c99a3c;
        --gold-light: #f3d488;
        --sea: #12708f;
        --turquoise: #3fc8c0;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        color: var(--milk);
        font-family: "Palatino Linotype", Palatino, "Iowan Old Style", Georgia, serif;
        background: #14507f;
        -webkit-font-smoothing: antialiased;
      }

      .hero {
        position: relative;
        min-height: 100svh;
        display: grid;
        align-items: end;
        overflow: hidden;
      }

      .hero img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 40%;
      }

      .veil {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(180deg, rgba(20, 80, 127, 0.15) 0%, rgba(58, 42, 23, 0.72) 100%),
          radial-gradient(ellipse at 50% 20%, transparent 30%, rgba(251, 246, 236, 0.12) 100%);
      }

      .inner {
        position: relative;
        z-index: 1;
        width: min(44rem, calc(100% - 2.5rem));
        margin: 0 auto 12vh;
        padding: 0 0.25rem;
      }

      .mark {
        letter-spacing: 0.28em;
        text-transform: uppercase;
        font-size: 0.72rem;
        color: var(--gold-light);
        margin: 0 0 0.85rem;
      }

      h1 {
        font-weight: 400;
        font-size: clamp(2.4rem, 7vw, 4.4rem);
        line-height: 0.95;
        margin: 0 0 1rem;
        letter-spacing: -0.03em;
      }

      .lede {
        max-width: 32rem;
        font-size: 1.15rem;
        line-height: 1.45;
        margin: 0 0 1.75rem;
        color: rgba(251, 246, 236, 0.88);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.7rem;
        margin-bottom: 2.2rem;
      }

      a.btn {
        display: inline-block;
        text-decoration: none;
        padding: 0.72rem 1.15rem;
        border-radius: 999px;
        font-size: 0.95rem;
        letter-spacing: 0.02em;
      }

      a.play {
        background: var(--gold);
        color: var(--ink);
      }

      a.play:hover {
        background: var(--gold-light);
      }

      a.ghost {
        color: var(--milk);
        border: 1px solid rgba(251, 246, 236, 0.45);
      }

      a.ghost:hover {
        border-color: var(--turquoise);
        color: var(--turquoise);
      }

      .game {
        border-top: 1px solid rgba(243, 212, 136, 0.28);
        padding-top: 1.1rem;
      }

      .game span {
        display: block;
        font-size: 0.7rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--gold-light);
        margin-bottom: 0.35rem;
      }

      .game strong {
        font-size: 1.35rem;
        font-weight: 400;
      }

      .game p {
        margin: 0.35rem 0 0;
        max-width: 28rem;
        color: rgba(251, 246, 236, 0.8);
        font-size: 0.98rem;
        line-height: 1.4;
      }

      footer {
        position: relative;
        z-index: 1;
        width: min(44rem, calc(100% - 2.5rem));
        margin: -8vh auto 2rem;
        display: flex;
        flex-wrap: wrap;
        gap: 0.85rem 1.4rem;
        font-size: 0.88rem;
      }

      footer a {
        color: rgba(251, 246, 236, 0.75);
        text-decoration: none;
      }

      footer a:hover {
        color: var(--gold-light);
      }
    </style>
  </head>
  <body>
    <main class="hero">
      <img src="media/shore.webp" alt="" />
      <div class="veil" aria-hidden="true"></div>
      <div class="inner">
        <p class="mark">Ovarlak Games</p>
        <h1>Tarayıcıda kısa Odysseia durakları.</h1>
        <p class="lede">
          İndirme yok. Ada güzelleştikçe unutursun. Kanalımız Ovarlak Gaming.
        </p>
        <div class="actions">
          <a class="btn play" href="https://lotophagoi.ovarlak.games/">Lotophagoi’yi oyna</a>
          <a class="btn ghost" href="https://www.youtube.com/@ovarlakgaming">YouTube</a>
        </div>
        <article class="game">
          <span>İlk durak</span>
          <strong>Lotophagoi</strong>
          <p>Lotus yiyorsun. Ada güzelleşiyor. Sen unutuyorsun.</p>
        </article>
      </div>
    </main>
    <footer>
      <a href="https://kick.com/ovarlakgaming">Kick</a>
      <a href="https://x.com/ovarlakgaming">X</a>
      <a href="https://www.instagram.com/ovarlakgaming/">Instagram</a>
      <a href="mailto:hello@ovarlak.games">hello@ovarlak.games</a>
      <span>© 2026 Ovarlak Games</span>
    </footer>
  </body>
</html>
