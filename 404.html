<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sayfa bulunamadı · Ovarlak Games</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f2ecd2" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --horizon: #f2ecd2;
        --ink: #163226;
        --leaf: #3f8f5c;
        --foam: #f6f3e8;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: linear-gradient(180deg, var(--horizon) 0%, #dfe9d6 60%, #a9c9bf 100%);
        color: var(--ink);
        font-family: "Fraunces", "Iowan Old Style", Palatino, Georgia, serif;
      }
      main {
        min-height: 100vh;
        display: grid;
        place-content: center;
        gap: 1rem;
        padding: 0 16px;
        text-align: center;
      }
      p.kicker {
        margin: 0;
        font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
        font-size: 0.75rem;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--leaf);
      }
      h1 { margin: 0; font-size: clamp(2.2rem, 8vw, 4rem); font-weight: 400; font-style: italic; }
      p { margin: 0; font-size: 1.1rem; }
      a {
        justify-self: center;
        margin-top: 0.8rem;
        padding: 0.8rem 1.4rem;
        border-radius: 999px;
        background: var(--ink);
        color: var(--foam);
        text-decoration: none;
        font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
      }
      a:focus-visible { outline: 2px solid var(--leaf); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p class="kicker">404</p>
      <h1>Bu ada haritada yok</h1>
      <p>Aradığın sayfa sisin içinde kaldı.</p>
      <a href="/">Ovarlak Games'e dön</a>
    </main>
  </body>
</html>
